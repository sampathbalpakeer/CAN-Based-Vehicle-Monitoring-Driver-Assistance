<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850">
  <rect width="1400" height="850" fill="#ffffff"/>
  <text x="700" y="55" text-anchor="middle" font-family="Arial" font-size="34" font-weight="bold">CAN-Driven Vehicle Monitoring and Driver Assistance System</text>
  <rect x="170" y="100" width="1060" height="70" rx="18" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/>
  <text x="700" y="145" text-anchor="middle" font-family="Arial" font-size="28" font-weight="bold">CAN BUS — Standard CAN IDs: 0x100 / 0x200 / 0x300</text>

  <rect x="60" y="230" width="380" height="500" rx="18" fill="#eef6ff" stroke="#2b6cb0" stroke-width="3"/>
  <text x="250" y="275" text-anchor="middle" font-family="Arial" font-size="28" font-weight="bold">FUEL NODE</text>
  <text x="250" y="310" text-anchor="middle" font-family="Arial" font-size="22">LPC2129</text>
  <rect x="120" y="350" width="260" height="70" rx="12" fill="#fff" stroke="#555"/>
  <text x="250" y="393" text-anchor="middle" font-family="Arial" font-size="22">Fuel Gauge / ADC</text>
  <rect x="120" y="455" width="260" height="70" rx="12" fill="#fff" stroke="#555"/>
  <text x="250" y="498" text-anchor="middle" font-family="Arial" font-size="22">Fuel Percentage</text>
  <rect x="120" y="560" width="260" height="70" rx="12" fill="#fff" stroke="#555"/>
  <text x="250" y="603" text-anchor="middle" font-family="Arial" font-size="22">CAN TX — 0x100</text>
  <path d="M250 420 V455 M250 525 V560 M250 170 V230" stroke="#333" stroke-width="4" fill="none" marker-end="url(#arrow)"/>

  <rect x="510" y="230" width="380" height="500" rx="18" fill="#fff6e8" stroke="#c77700" stroke-width="3"/>
  <text x="700" y="275" text-anchor="middle" font-family="Arial" font-size="28" font-weight="bold">MAIN NODE</text>
  <text x="700" y="310" text-anchor="middle" font-family="Arial" font-size="22">LPC2129 — Central Controller</text>
  <rect x="560" y="345" width="280" height="62" rx="12" fill="#fff" stroke="#555"/>
  <text x="700" y="383" text-anchor="middle" font-family="Arial" font-size="21">DS18B20 — P0.20</text>
  <rect x="560" y="430" width="280" height="62" rx="12" fill="#fff" stroke="#555"/>
  <text x="700" y="468" text-anchor="middle" font-family="Arial" font-size="21">20×4 LCD</text>
  <rect x="560" y="515" width="280" height="62" rx="12" fill="#fff" stroke="#555"/>
  <text x="700" y="553" text-anchor="middle" font-family="Arial" font-size="21">Mode + Indicator Switches</text>
  <rect x="560" y="600" width="280" height="62" rx="12" fill="#fff" stroke="#555"/>
  <text x="700" y="638" text-anchor="middle" font-family="Arial" font-size="21">CAN TX/RX — 0x200 / 0x300</text>
  <path d="M700 170 V230" stroke="#333" stroke-width="4" fill="none" marker-end="url(#arrow)"/>

  <rect x="960" y="230" width="380" height="500" rx="18" fill="#f5efff" stroke="#7048a8" stroke-width="3"/>
  <text x="1150" y="275" text-anchor="middle" font-family="Arial" font-size="26" font-weight="bold">INDICATOR &amp; REVERSE</text>
  <text x="1150" y="310" text-anchor="middle" font-family="Arial" font-size="26" font-weight="bold">ALERT NODE</text>
  <text x="1150" y="345" text-anchor="middle" font-family="Arial" font-size="22">LPC2129</text>
  <rect x="1010" y="375" width="280" height="62" rx="12" fill="#fff" stroke="#555"/>
  <text x="1150" y="413" text-anchor="middle" font-family="Arial" font-size="21">HC-SR05 / ultrasonic*</text>
  <rect x="1010" y="460" width="280" height="62" rx="12" fill="#fff" stroke="#555"/>
  <text x="1150" y="498" text-anchor="middle" font-family="Arial" font-size="21">Indicator LEDs</text>
  <rect x="1010" y="545" width="280" height="62" rx="12" fill="#fff" stroke="#555"/>
  <text x="1150" y="583" text-anchor="middle" font-family="Arial" font-size="21">Buzzer + STOP LED</text>
  <rect x="1010" y="630" width="280" height="62" rx="12" fill="#fff" stroke="#555"/>
  <text x="1150" y="668" text-anchor="middle" font-family="Arial" font-size="21">CAN TX/RX — 0x200 / 0x300</text>
  <path d="M1150 170 V230" stroke="#333" stroke-width="4" fill="none" marker-end="url(#arrow)"/>

  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#333"/></marker></defs>
  <text x="700" y="805" text-anchor="middle" font-family="Arial" font-size="18">*Institute abstract specifies HC-SR05; supplied driver source is named hcsr04.c and must be verified against the final sensor.</text>
</svg>
